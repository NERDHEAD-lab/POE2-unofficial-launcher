name: Update Theme List Hashes

on:
  push:
    branches:
      - gh-pages
    paths:
      - "assets/themes/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-hashes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout gh-pages
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: gh-pages

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Get generation script from master
        run: |
          mkdir -p scripts
          curl -s https://raw.githubusercontent.com/NERDHEAD-lab/POE2-unofficial-launcher/master/scripts/generate-theme-hashes.js -o scripts/generate-theme-hashes.js

      - name: Generate hashes
        run: node scripts/generate-theme-hashes.js

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add themes.json
          git commit -m "chore: update theme asset hashes [skip ci]" || echo "No changes to commit"
          git push origin gh-pages
