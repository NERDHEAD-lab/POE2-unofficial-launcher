name: Sync Roadmap Issue

on:
  push:
    branches:
      - master
    paths:
      - "docs/Roadmap.md"
      - "docs/roadmap/**"
      - "scripts/build-roadmap-issue-body.cjs"
      - ".github/workflows/sync-roadmap-issue.yml"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Build issue body
        run: node scripts/build-roadmap-issue-body.cjs --output roadmap-issue-body.md

      - name: Update GitHub Issue #7
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh issue edit 7 --repo "$GITHUB_REPOSITORY" --body-file roadmap-issue-body.md
