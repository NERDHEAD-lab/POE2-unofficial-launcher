name: pr-check

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Resolve PoB source ref
        id: pob-source-ref
        run: npm run pob:source:prepare -- --resolve-only
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Cache PoB source
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: .cache/pob-source
          key: pob-source-${{ runner.os }}-${{ steps.pob-source-ref.outputs.cache-key }}

      - name: Prepare PoB source
        run: npm run pob:source:prepare
        env:
          GITHUB_TOKEN: ${{ github.token }}
          POB_SOURCE_REF: ${{ steps.pob-source-ref.outputs.ref }}

      - name: Test
        run: npm test
        env:
          POB_SOURCE_REQUIRED: "1"

      - name: Build Check
        run: npm run build:check
